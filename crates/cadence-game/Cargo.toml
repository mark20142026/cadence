[package]
name = "cadence-game"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cadence-game"
path = "src/main.rs"

[dependencies]
cadence-core.workspace = true
bytemuck.workspace = true
plist.workspace = true
png.workspace = true
pollster.workspace = true
wgpu.workspace = true
winit.workspace = true
web-time = "1"
base64.workspace = true
# the game servers' checksums (GJP2, chk): SHA-1
sha1 = "0.10"
# the news popup's pictures (JPEG)
zune-jpeg = "0.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "vorbis"] }
ureq = "2"

# the game servers: the same system libcurl the game uses (same TLS, HTTP version and headers).
# On macOS always the system's (no OpenSSL: the Intel build is cross-compiled, where curl-sys
# would otherwise build its own curl against an OpenSSL that isn't there)
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "macos")))'.dependencies]
curl = "0.4"

# local time for message times (the thread view): the system's offset from UTC
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Time", "Win32_Foundation"] }

# CADENCE_CORNER parks the window with AppKit (the versions winit already uses)
[target.'cfg(target_os = "macos")'.dependencies]
curl = { version = "0.4", default-features = false, features = ["force-system-lib-on-osx"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console", "Window", "Navigator", "Storage", "Location", "Request", "RequestInit", "Response", "Headers"] }
js-sys = "0.3"
